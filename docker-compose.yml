services:
  # ─── 1. PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: auto_pub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autopub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopub_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-autopub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autopub} -d ${POSTGRES_DB:-autopub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── 2. Redis Cache & BullMQ Queue ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auto_pub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── 3. MinIO S3-Compatible Object Storage ──────────────────────────────────
  minio:
    image: pgsty/silo:latest
    container_name: auto_pub_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 4. MinIO Bucket Initialization ────────────────────────────────────────
  minio-init:
    image: pgsty/mc:latest
    container_name: auto_pub_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_secret};
      /usr/bin/mc mb myminio/${S3_BUCKET_NAME:-social-media-assets} || true;
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-social-media-assets};
      echo 'MinIO Bucket ${S3_BUCKET_NAME:-social-media-assets} created and configured!';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
